name: Release

# Pushed by `cargo release` (see release.toml).
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  publish:
    needs: ci
    runs-on: ubuntu-24.04
    # Name this environment in the crates.io trusted publisher settings.
    environment: release
    permissions:
      contents: read
      # Trusted publishing: GitHub's OIDC token is exchanged for a
      # short-lived crates.io token; no secret is stored.
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Tag matches Cargo.toml
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')
          if [ "$TAG" != "v$version" ]; then
            echo "tag $TAG does not match Cargo.toml version $version" >&2
            exit 1
          fi
      - uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
        id: auth
      - run: cargo publish --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
